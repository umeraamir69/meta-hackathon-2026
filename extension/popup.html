<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PR Diff Sentinel</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <strong class="brand">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <path fill="#e4ff57" d="M5 3h22v13.5L16 29 5 16.5z"/>
        <path d="M10.5 15.2 14.2 19.2 22 10.4" fill="none" stroke="#14150f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Sentinel
    </strong>
    <span id="state">Ready</span>
  </header>

  <main>
    <form id="scan" class="scan-bar">
      <div class="field">
        <label for="url">GitHub link</label>
        <input id="url" name="url" type="text" placeholder="PR, commit, or repository" required autocomplete="off" spellcheck="false">
      </div>
      <button type="submit" id="go">Scan</button>
    </form>

    <p id="message"></p>

    <!-- Results first so Pass/Fail is never buried under the list -->
    <section id="report" hidden></section>

    <section id="picker" hidden>
      <div class="picker-head">
        <strong id="picker-title">Pick a PR or commit</strong>
        <button type="button" id="change-pick" class="text-btn" hidden>Change</button>
      </div>
      <p class="picker-hint" id="picker-hint">Tap one row to scan it.</p>
      <div id="pick-list" class="pick-list"></div>
    </section>
  </main>

  <footer id="foot" hidden>
    <a id="full" href="#" target="_blank" rel="noreferrer">Full report</a>
    <button type="button" id="dash" class="linkish">Dashboard</button>
  </footer>

  <script src="history.js"></script>
  <script src="popup.js"></script>
</body>
</html>
