<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PR Diff Sentinel</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <strong class="brand"><i></i>Sentinel</strong>
    <span id="state">Ready</span>
  </header>
  <form id="scan">
    <label for="url">GitHub link</label>
    <input id="url" name="url" type="text" placeholder="Pull request or repository" required>
    <label for="api">API</label>
    <input id="api" name="api" type="text" spellcheck="false" value="http://127.0.0.1:3000">
    <button type="submit">Scan</button>
  </form>
  <p id="message"></p>
  <section id="report" hidden></section>
  <script src="popup.js"></script>
</body>
</html>
