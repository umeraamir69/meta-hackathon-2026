<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PR Diff Sentinel</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <strong class="brand">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <path fill="#e4ff57" d="M5 3h22v13.5L16 29 5 16.5z"/>
        <path d="M10.5 15.2 14.2 19.2 22 10.4" fill="none" stroke="#14150f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Sentinel
    </strong>
    <span id="state">Ready</span>
  </header>
  <main>
    <form id="scan">
      <div class="field">
        <label for="url">GitHub link</label>
        <input id="url" name="url" type="text" placeholder="Pull request or repository" required autocomplete="off" spellcheck="false">
      </div>
      <div class="field">
        <label for="api">API</label>
        <input id="api" name="api" type="text" spellcheck="false" value="http://127.0.0.1:3000" autocomplete="off">
      </div>
      <button type="submit">Scan</button>
    </form>
    <p id="message"></p>
    <section id="report" hidden></section>
  </main>
  <footer id="foot" hidden>
    <a id="full" href="#" target="_blank" rel="noreferrer">Open full report</a>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
