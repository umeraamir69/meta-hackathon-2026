name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Tests
        working-directory: project
        run: node --test test/*.test.js
      - name: History demo
        working-directory: project
        run: node scripts/demo-history.mjs
      - name: Scan this repository
        uses: ./project
        with:
          path: .
          history: 'true'
          muse: 'false'
